name: Build Development Client

# Manually triggered — only needed when native deps change
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you rebuilding the dev client?'
        required: false
        default: 'Native dependency update'

jobs:
  build:
    name: EAS Development Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build dev client APK
        run: eas build --platform android --profile development --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
